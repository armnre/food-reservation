<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#25145f" />
    <title>اتصال اینترنت | هم‌سفره</title>
    <style>
      @font-face {
        font-family: v;
        src: url('/fonts/vazirmatn.woff2');
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f7f7fa;
        color: #30243e;
        font-family: v, system-ui;
        line-height: 1.9;
        padding: 25px;
      }
      main {
        max-width: 390px;
        text-align: center;
      }
      img {
        border-radius: 24px;
      }
      h1 {
        font-size: 23px;
        margin-top: 28px;
      }
      p {
        font-size: 13px;
        color: #7d778b;
      }
      button {
        font: inherit;
        min-height: 48px;
        background: #25145f;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 25px;
        margin-top: 20px;
        cursor: pointer;
      }
      small {
        display: block;
        font-size: 11px;
        color: #9b94a8;
        margin-top: 25px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/hamsofre.svg" width="76" height="76" alt="هم‌سفره" />
      <h1>کمی از اینترنت فاصله گرفتیم!</h1>
      <p>برای دیدن اطلاعات به‌روز و انجام رزرو یا پرداخت، به اینترنت متصل شوید و دوباره تلاش کنید.</p>
      <button onclick="location.reload()">تلاش برای اتصال مجدد</button
      ><small>برای امنیت شما، اطلاعات حساب و کیف پول آفلاین ذخیره نمی‌شود.</small>
    </main>
  </body>
</html>
