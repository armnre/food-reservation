name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hamsofre_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hamsofre_test
      REDIS_URL: redis://127.0.0.1:6379
      TZ: Asia/Tehran
      # کلیدهای زیر فقط fixture تست هستند (مقدار رمزگشایی‌شدهٔ آن‌ها «test-...» است)
      # و هیچ‌گاه کلید واقعی محیط production نیستند. کلیدهای واقعی فقط از
      # GitHub Secrets تزریق می‌شوند و هرگز در ریپو commit نمی‌شوند.
      DATA_ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyEhIQ==
      DATA_HASH_KEY: dGVzdC1oYXNoLWtleS0zMi1ieXRlcy0zMmJ5dGVzIQ==
      QR_SIGNING_KEY: dGVzdC1xci1zaWduaW5nLWtleS0zMi1ieXRlc3M=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # فاز ۱-۳: بررسی قالب‌بندی — اگر fomat:check در package.json نبود، مستقیم prettier
      - name: بررسی قالب‌بندی (Prettier)
        run: npm run format:check --if-present || npx prettier --check .
      - run: npm run lint
      - run: npx next typegen
      - run: npm exec tsc -- --noEmit --pretty false
      - run: npx vitest run
      - name: تست یکپارچه روی دیتابیس واقعی
        run: npx tsx scripts/migrate.ts && npx vitest run --config vitest.config.integration.ts
      - run: npm run build
      - run: npm audit --omit=dev || true
